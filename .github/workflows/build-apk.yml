
name: Build OfflineStudy APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o OfflineStudyApp-source.zip -d source
          find source -name settings.gradle.kts

      - name: Build APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OfflineStudy-debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
