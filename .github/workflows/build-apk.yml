
name: Build OfflineStudy APK

on:
  workflow_dispatch:
  push:
    paths:
      - "OfflineStudyApp-source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -o OfflineStudyApp-source.zip -d source
          find source -name settings.gradle.kts -print

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle.kts -print -quit)")"
          cd "$PROJECT_DIR"
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OfflineStudy-debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
